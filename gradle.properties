# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# El backend Wasm (IR + optimizaciones) de :webApp necesita más heap que el resto de módulos.
# Sin esto, `compileProductionExecutableKotlinWasmJs` falla con «Not enough memory». ADR-023.
kotlin.daemon.jvmargs=-Xmx4096m
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. For more details, visit
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
# org.gradle.parallel=true
# When enabled, the Configuration Cache allows Gradle to skip the configuration
# phase entirely if nothing that affects the build configuration (such as build scripts)
# has changed. Additionally, Gradle applies performance optimizations to task execution.
org.gradle.configuration-cache=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
android.disallowKotlinSourceSets=false

# ─────────────────────────────────────────────────────────────────────────────
# VERSIÓN — FUENTE ÚNICA DE VERDAD
#
# De aquí la leen TODAS las plataformas y empaquetados: Android (`versionName`),
# escritorio (`packageVersion` del MSI/EXE y del MSIX) y el texto «Versión X» del
# diálogo «Acerca de». No repetir el número en ningún otro fichero.
#
# Por qué existe: hasta la 1.1.3 la versión estaba escrita a mano en cinco sitios
# (`app/build.gradle.kts`, `desktopApp/build.gradle.kts`, los dos `AppxManifest`,
# `build_msix.bat` y un literal en `DesktopContainer`). El literal de escritorio se
# quedó en «1.0.24-desktop» y la app instalada desde la Microsoft Store 1.1.3 seguía
# mostrando esa versión vieja en «Acerca de». Ver ADR-022.
#
# Al publicar una versión nueva, cambiar SOLO estas dos líneas:
#   · `canticora.version`   → lo que ve el usuario (semver, sin cuarto dígito).
#   · `canticora.versionCode` → entero monótono que exige Google Play.
# ─────────────────────────────────────────────────────────────────────────────
canticora.version=1.1.4
canticora.versionCode=43

# ── Kotlin/Wasm (web) ───────────────────────────────────────────────────────
# El plugin de Kotlin descargaría su propia distribución de Node desde nodejs.org, y el
# proyecto usa `FAIL_ON_PROJECT_REPOS`: la añadiría como repositorio de PROYECTO y el build
# aborta. Se usa el Node instalado en la máquina (el mismo que usa el empaquetado web).
kotlin.js.nodejs.download=false
kotlin.js.yarn=false
